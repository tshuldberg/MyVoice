name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build the universal native addon
        run: npm run build:native
      - name: Unit tests
        run: npm test
      - name: Build the bundled whisper-cli
        run: npm run build:whisper
      - name: Release preflight reports missing signing setup without building
        run: |
          if bash scripts/release-mac.sh --check; then
            echo "Preflight should fail on a CI runner without signing credentials" >&2
            exit 1
          fi
